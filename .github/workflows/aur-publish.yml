name: aur-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pkgver from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          sed -i "s/^pkgver=.*/pkgver=${TAG}/" PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          sed -i "s/^\tpkgver = .*/\tpkgver = ${TAG}/" .SRCINFO
          sed -i 's/^\tpkgrel = .*/\tpkgrel = 1/' .SRCINFO

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY not set, skipping"
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          git clone ssh://aur@aur.archlinux.org/openunivpn.git /tmp/aur
          cd /tmp/aur
          git config user.name "tsaitang404"
          git config user.email "tsaitang.agent@gmail.com"
          for f in PKGBUILD .SRCINFO openunivpn.install openunivpn.service README.md LICENSE client.py config.py protocol-format.md .gitignore; do
            [ -f "$GITHUB_WORKSPACE/$f" ] && cp "$GITHUB_WORKSPACE/$f" .
          done
          git add -A
          if git diff --cached --quiet; then
            echo "No changes, AUR up to date"
            exit 0
          fi
          VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          git commit -m "chore: publish v${VER}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git push origin master
